# Verified against Cachalot 0.62.22 (5faabab). Null overrides in Lab profiles
# inherit the runtime's version-specific default; zero has each knob's stated effect.
knobs:
  - key: CACHALOT_GLM_DECODE_MISS_BUDGET
    kind: env
    families: [glm-5.3-flash]
    type: int-or-off
    default: { direct_cli: null, serve_script_since_0_62_20: 2 }
    lab_range: [-1, 288]
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.62.14
    lab: Optional GLM-only next-launch integer; empty inherits off, -1 explicitly disables the budget, 0 drops all non-resident misses. Inherited key is removed before applying profile overrides. Older profiles omit it; family changes clear it.
    summary: Per decode layer reads at most N non-resident experts, highest router weight first; drops others and scales kept outputs by total/kept router weight. Prefill is unchanged. Unset, empty, off, exact, or negative disables it. Lab makes no speed or quality magnitude claim.
  - key: CACHALOT_READ_THROTTLE_GBPS
    kind: env
    families: [deepseek-v4.1-flash, glm, minimax]
    type: float
    unit: decimal-GB-per-second
    default: 0
    group: experimentation
    effect: timing-only
    restart_required: true
    stability: shipped
    since: 0.61.0
    lab: Contract only; no launch control or manifest is implemented. Lab does not set or remove this environment key. Future manifests must label it emulated drive bandwidth and distinguish requested from reported settings.
    summary: Read at reader-module import. Unset, empty, or zero disables throttling. Positive B shares one process-wide pipe across ExpertReader reads (and MiniMax coded-bank records since 0.61.14) lasting at least 1 ms; faster reads bypass it. No HTTP field reports whether it is active. Non-numeric values fail runtime import; nonfinite inputs are not a supported Lab control.
  - key: CACHALOT_DECODE_MISS_BUDGET
    kind: env
    families: [deepseek-v4.1-flash]
    type: int-or-off
    default: { direct_cli: null, serve_script_since_0_60_0: 0 }
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.57.0
    lab: Nullable DeepSeek-only switch. On writes 0; Off writes -1 for compatibility with 0.57+. Empty emits nothing and inherits the direct CLI exact path after inherited keys are removed.
    summary: Caps non-resident expert reads per decode layer; remaining misses are dropped. Unset, empty, or negative disables dropping. Since 0.60, off and exact also disable it. Prefill and snapshot numerics are unchanged. No Lab speed or quality magnitude is promised.
  - key: CACHALOT_SYSTEM_DATE_REUSE
    kind: env
    families: [deepseek-v4.1-flash]
    type: bool
    default: true
    group: prefix-cache
    effect: changes-system-date
    restart_required: true
    stability: shipped
    since: 0.60.0
    lab: Nullable DeepSeek-only switch; On writes 1, Off writes 0, empty inherits On. Inherited DAYS is removed so the documented seven-day window is used.
    summary: Reuses the leading system message's Conversation started date within the window. The model may see a date up to seven days old. system-dates.json beside snapshots persists the mapping; client history is untouched.
  - key: CACHALOT_SYSTEM_DATE_REUSE_DAYS
    kind: env
    families: [deepseek-v4.1-flash]
    type: int
    default: 7
    group: prefix-cache
    effect: changes-system-date
    restart_required: true
    stability: shipped
    since: 0.60.0
    lab: Not exposed; inherited value removed for managed launches.
    summary: Nonnegative reuse window in days; invalid integer falls back to 7 and negative clamps to 0 in runtime source.
  - key: CACHALOT_WIRED_CEILING_GIB
    kind: env
    families: [deepseek-v4.1-flash]
    type: float
    default: 76-percent-of-host-RAM
    since: 0.54.0
    effect: bit-identical
    lab: Not exposed; runtime manages resident capacity. Expert budget is an upper bound.
    summary: Zero or negative disables the wired-memory governor. Source constant is 0.76 despite an outdated 77 percent function docstring.
  - key: CACHALOT_WIRED_HYSTERESIS_GIB
    kind: env
    families: [deepseek-v4.1-flash]
    type: float
    default: 1.5
    since: 0.54.0
    effect: bit-identical
    lab: Not exposed.
  - key: CACHALOT_WIRED_GROW_QUIET_S
    kind: env
    families: [deepseek-v4.1-flash]
    type: float
    default: 60
    since: 0.54.0
    effect: bit-identical
    lab: Not exposed.
  - key: CACHALOT_WIRED_CHECK_EVERY
    kind: env
    families: [deepseek-v4.1-flash]
    type: int
    default: 16
    since: 0.54.0
    effect: bit-identical
    lab: Not exposed.
  - key: CACHALOT_ROUTING_TRACE
    kind: env
    families: [deepseek-v4.1-flash, glm-5.3-flash, minimax-m3]
    type: path
    since: 0.55.0
    since_glm_minimax: 0.62.0
    since_glm_weights_predictions: 0.62.10
    effect: instrumentation
    lab: Contract only; no viewer, trace control, or capture is implemented. Traced runs are not uninstrumented speed baselines; end-to-end overhead remains unmeasured by Lab.
    summary: NPZ contains phase, layer, position, experts, segments. GLM 0.62.10+ optionally adds float32 weights shaped like experts and pred_source/pred_target/pred_position/pred_experts/pred_weights, as DeepSeek does. MiniMax has no router weights; substitution makes its prefill routes post-substitution and decode routes router picks. GLM/MiniMax positions are per-(phase, layer) counters unique within a run, not reset per request. Decode token boundaries in predicted_used_mask follow a layer that stops ascending; this is offline routing evidence, not a timed token profile.
  - key: CACHALOT_GLM_VIDEO_MAX_FRAMES
    kind: env
    families: [glm-5.3-flash]
    type: int
    default: 128
    since: 0.52.0
    lab: Not exposed; Lab media attachments remain pending.
  - key: CACHALOT_GLM_VIDEO_MAX_TOKENS
    kind: env
    families: [glm-5.3-flash]
    type: int
    default: 4000
    since: 0.52.0
    lab: Not exposed; clip resolution is reduced to fit the token budget.
  - key: CACHALOT_GLM_BANK
    kind: env
    families: [glm-5.3-flash]
    type: absolute-path
    group: storage
    effect: bit-identical
    restart_required: true
    stability: shipped
    since: 0.49.0
    summary: Optional contiguous expert bank containing bank.json. Lab checks the manifest exists when enabled; the runtime validates its format and layer files.
  - key: CACHALOT_GLM_BANK_ENABLED
    kind: env
    families: [glm-5.3-flash]
    type: bool
    default: { glm-5.3-flash: true }
    group: storage
    effect: bit-identical
    restart_required: true
    stability: shipped
    since: 0.49.0
    summary: 0 ignores a configured bank and uses checkpoint experts. Unset bank path still means no bank in the direct CLI. Since 0.61.9 serve-glm.sh conditionally selects /Volumes/X10Pro/models/GLM-5.3-Flash-bank when bank.json exists and the key is unset; empty key or ENABLED=0 disables that script selection. Lab does not adopt the owner-specific path.
  - key: CACHALOT_GLM_PREDICT_TOPK
    kind: env
    families: [glm-5.3-flash]
    type: int
    default: { direct_cli: 5, serve_script_since_0_62_14: 0 }
    lab_range: [0, 288]
    group: speed
    effect: bit-identical
    restart_required: true
    stability: shipped
    since: 0.50.0
    summary: Next-layer experts predicted during decode; 0 disables prediction. Lab bounds counts to GLM-5.3-Flash's 288 experts.
  - key: CACHALOT_GLM_PREDICT_LIMIT
    kind: env
    families: [glm-5.3-flash]
    type: int
    default: { glm-5.3-flash: 0 }
    lab_range: [0, 288]
    group: speed
    effect: bit-identical
    restart_required: true
    stability: shipped
    since: 0.50.0
    summary: Predicted reads started per layer; 0 reads all predicted experts.
  - key: CACHALOT_GLM_PREDICT_AFTER_DEMAND
    kind: env
    families: [glm-5.3-flash]
    type: int
    default: { glm-5.3-flash: 1 }
    lab_range: [-1, 1]
    group: speed
    effect: bit-identical
    restart_required: true
    stability: shipped
    since: 0.50.0
    summary: 1 waits for demand reads, 0 reads alongside them, -1 follows the store's CACHALOT_DECODE_PREFETCH_AFTER_DEMAND policy. Empty inherits the runtime's own default.
  - key: CACHALOT_MINIMAX_MISS_DROP
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 0.20 }
    previous_default: { before: 0.43.0, minimax-m3: 0 }
    range: [0, 0.25]
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.39.0
    summary: Decode miss substitution. 0 is exact; 0.20 pairs with MISS_SUB=4.
  - key: CACHALOT_MINIMAX_MISS_SUB
    kind: env
    families: [minimax-m3]
    type: int
    default: { minimax-m3: 4 }
    previous_default: { before: 0.43.0, minimax-m3: 0 }
    range: [0, 8]
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.39.0
    summary: Resident runner-up search depth for miss substitution.
  - key: CACHALOT_MINIMAX_MISS_DROP_ARMED
    kind: env
    families: [minimax-m3]
    type: bool
    default: { minimax-m3: false }
    group: debug
    effect: bit-identical
    restart_required: true
    stability: debug
    since: 0.39.0
    summary: Benchmark instrumentation only; not a Lab profile control.
  - key: CACHALOT_LOOP_GUARD_REPEATS
    kind: env
    families: [glm-5.3-flash, minimax-m3]
    type: int
    default: { glm-5.3-flash: 6, minimax-m3: 6 }
    range: [0, 50]
    group: decode
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.40.0
    summary: Stop repeated reply blocks; 0 disables the guard.
  - key: CACHALOT_LOOP_GUARD_INCREMENTING
    kind: env
    families: [glm-5.3-flash, minimax-m3]
    type: int
    default: { glm-5.3-flash: 64, minimax-m3: 64 }
    lab_range: [0, 4096]
    group: decode
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.46.0
    summary: Stop invented list items that differ only by an integer counting up by one; 0 disables the guard. Lab rejects 1 because the runtime requires at least 2 items.
  - key: CACHALOT_MINIMAX_DECODE_CACHE_GIB
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 0.25 }
    range: [-1, 8]
    unit: GiB
    group: memory
    effect: speed-only
    restart_required: true
    stability: shipped
    since: 0.41.0
    summary: MLX buffer cache cap during decode; -1 retains the prefill cap.
  - key: CACHALOT_MINIMAX_SPILL_BLOCKS
    kind: env
    families: [minimax-m3]
    type: bool
    default: { minimax-m3: true }
    group: memory
    effect: speed-only
    restart_required: true
    stability: shipped
    since: 0.41.0
    summary: Saved system blocks leave memory after a request; 0 keeps them resident.
  - key: CACHALOT_MINIMAX_PREFILL_MISS_DROP
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 0.20 }
    previous_default: { before: 0.43.0, minimax-m3: 0 }
    range: [0, 0.25]
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.42.0
    summary: Prefill miss substitution. 0 is exact; 0.20 pairs with MISS_SUB=4.
  - key: CACHALOT_MINIMAX_PREFILL_SUB_MAX_ROWS
    kind: env
    families: [minimax-m3]
    type: int
    default: { minimax-m3: 32 }
    group: speed
    effect: changes-outputs
    restart_required: true
    stability: shipped
    since: 0.42.0
    summary: Experts routed to more than this many tokens are always read.
  - key: CACHALOT_HOST_GROW_QUIET_S
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 60 }
    unit: seconds
    group: memory
    effect: speed-only
    restart_required: true
    stability: shipped
    since: 0.44.0
    summary: Quiet host-memory interval before expert-cache growth; 0 disables the pressure watcher and restores the earlier governor.
  - key: CACHALOT_HOST_SHRINK_EVERY_S
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 10 }
    unit: seconds
    group: memory
    effect: speed-only
    restart_required: true
    stability: shipped
    since: 0.44.0
    summary: Minimum interval between pressure-driven expert slab returns.
  - key: CACHALOT_MINIMAX_MIRROR_ADAPT
    kind: env
    families: [minimax-m3]
    type: bool
    default: { minimax-m3: true }
    previous_default: { before: 0.45.0, minimax-m3: false }
    group: storage
    effect: speed-only
    restart_required: true
    stability: shipped
    since: 0.45.0
    summary: With a configured mirror, adjust its read share to measured drive speeds; 0 keeps the configured fraction fixed.
  - key: CACHALOT_MINIMAX_BANK
    kind: env
    families: [minimax-m3]
    type: absolute-path
    group: storage
    effect: speed-only
    restart_required: true
    stability: shipped
    summary: Directory containing the MiniMax coded expert bank and bank.json.
  - key: CACHALOT_MINIMAX_BANK_MIRROR
    kind: env
    families: [minimax-m3]
    type: absolute-path
    group: storage
    effect: speed-only
    restart_required: true
    stability: shipped
    summary: Identical bank copy on another drive; requires CACHALOT_MINIMAX_BANK.
  - key: CACHALOT_MIRROR_FRACTION
    kind: env
    families: [minimax-m3]
    type: float
    default: { minimax-m3: 0.10 }
    range: [0, 0.9]
    group: storage
    effect: speed-only
    restart_required: true
    stability: shipped
    summary: Maximum share of each expert read assigned to the mirror; requires a mirror path in Lab.
