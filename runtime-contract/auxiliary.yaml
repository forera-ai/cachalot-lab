# Source-reviewed Cachalot 0.69.7, bd9bb457b1ef1346b7f71983c85051cea266ab1e.
# Standalone auxiliary API only; no Lab serving control or benchmark import exists.
auxiliary:
  since: 0.69.0
  group: auxiliary-apple-on-device-model
  serving_path: false
  default_enabled: false
  lab: Contract only. Lab does not set or remove these keys, probe or launch auxiliary inference, route requests, compress prompts, or import benchmark files.
  caution: Not in the serving path; compression measured as a loss, routing not validated for use.
  configuration:
    CACHALOT_AUX_ENABLED: { type: bool, default: false }
    CACHALOT_AUX_PROVIDER:
      {
        type: enum,
        values: [apple_foundation_models, deterministic],
        default: apple_foundation_models,
      }
    CACHALOT_AUX_MODEL: { type: enum, values: [system], default: system }
    CACHALOT_AUX_ISOLATION:
      { type: enum, values: [process, inline], default: process }
    CACHALOT_AUX_TIMEOUT_MS: { type: positive-int, default: 10000, unit: ms }
    CACHALOT_AUX_MAX_CONCURRENT_REQUESTS: { type: positive-int, default: 1 }
    CACHALOT_AUX_QUEUE_LIMIT: { type: nonnegative-int, default: 4 }
    CACHALOT_AUX_USE_CASE:
      { type: enum, values: [general, content_tagging], default: general }
    CACHALOT_AUX_CLASSIFICATION: { type: bool, default: false }
    CACHALOT_AUX_STRUCTURED_EXTRACTION: { type: bool, default: false }
    CACHALOT_AUX_CONTEXT_COMPRESSION: { type: bool, default: false }
    CACHALOT_AUX_SEMANTIC_VALIDATION:
      { type: bool, default: false, implementation: research-only-no-task }
    CACHALOT_AUX_ADAPTIVE_ROUTING: { type: bool, default: false }
    CACHALOT_AUX_COMPRESSION_MIN_TOKENS: { type: int, default: 2000 }
    CACHALOT_AUX_COMPRESSION_MAX_RATIO: { type: float, default: 0.6 }
    CACHALOT_AUX_COMPRESSION_MAX_UNGROUNDED: { type: float, default: 0.1 }
  cli:
    command: cachalot aux check|respond|classify|extract|compress
    opt_in: Each command explicitly enables the layer and its task for that invocation; never loads a target model.
    check: JSON capabilities include available, unavailable_reason, context_tokens and local_only (always true); context is provider-specific, not target context.
  benchmark:
    producer: benchmarks/apple_fm_bench.py
    format: run_manifest.py manifest plus JSON-lines rows and a final measure-summary row
    location: benchmarks/results/apple-fm/<arm>-<utc>.jsonl
    provenance:
      [
        experiment_id,
        manifest_id,
        hardware,
        macos_version,
        provider,
        provider_version,
        target_model,
      ]
    measurements:
      [
        auxiliary_latency,
        time_to_first_token,
        tokens_per_second,
        prompt_tokens,
        ratio,
        fact_retention,
        median_rate,
        rate_unit,
      ]
    target_model: none in the initial 0.69.0 arms; later experiments require their own provenance
    future_import: Keep auxiliary, target and combined throughput distinct; contention GPU B/s or FLOP/s must not be plotted as system-model tok/s. Preserve units, scope, raw rows, unavailable values, experiment protocol and corrections.
