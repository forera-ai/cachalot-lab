# Source-reviewed HTTP fields, not inferred from launch knobs or startup logs.
reviewed_runtime:
  version: 0.64.17
  commit: cf328cc8cef9da37c4348054ddb0c4128e09c570
endpoint: /v1/stats
fields:
  decode_miss_budget:
    meaning: DeepSeek per-layer decode miss read cap; null means no miss dropping.
    type: nullable_nonnegative_integer
    optional: true
    lab: Not yet displayed; do not infer exactness of all output paths from this single field.
  skipped_experts:
    meaning: Cumulative dropped experts since server start, not a quality score or active-mode declaration. GLM always reports zero with its budget off; MiniMax reports zero through the shared engine.
    type: nonnegative_integer
    optional: true
    families: [deepseek, glm, minimax]
    since_glm_minimax: 0.62.14
    lab: Always shown in read/wait evidence with independent unknown/zero validation; positive totals also qualify the cache hit-rate readout as outputs changed. Zero does not establish exact outputs.
  predicted_loads:
    meaning: Number of predicted expert reads submitted by the resident store.
    type: nonnegative_integer
    optional: true
  predicted_used:
    meaning: Number of predicted reads consumed by demand loading.
    type: nonnegative_integer
    optional: true
  expert_hits:
    meaning: Cumulative expert-store lookup hits, including prefill and decode.
    type: nonnegative_integer
    optional: true
  expert_misses:
    meaning: Cumulative expert-store lookup misses, including prefill and decode.
    type: nonnegative_integer
    optional: true
  ssd_bytes_read:
    meaning: Bytes accounted by the expert store; not physical-drive traffic. Not the separate internal read_bytes tally.
    type: nonnegative_integer
    unit: bytes
    optional: true
  expert_reads:
    meaning: Cumulative instrumented expert reads, including demand and speculative reads.
    type: nonnegative_integer
    optional: true
  expert_fast_reads:
    meaning: Reads faster than the runtime threshold (default 1 ms), a page-cache heuristic rather than measured cache residency.
    type: nonnegative_integer
    optional: true
  expert_read_seconds:
    meaning: Sum of instrumented read wall times; overlapping reads can exceed elapsed wall time.
    type: nonnegative_finite_number
    unit: seconds
    optional: true
  expert_read_busy_seconds:
    meaning: Wall time with at least one instrumented read in flight, including the current busy interval.
    type: nonnegative_finite_number
    unit: seconds
    optional: true
    families: [glm, minimax]
    since: 0.61.1
  decode_wait_seconds:
    meaning: Cumulative time the decode caller waited for misses; not request duration or critical-path attribution.
    type: nonnegative_finite_number
    unit: seconds
    optional: true
    families: [glm, minimax]
    since: 0.61.1
  decode_waited_misses:
    meaning: Cumulative decode misses counted by the caller's wait accounting.
    type: nonnegative_integer
    optional: true
    families: [glm, minimax]
    since: 0.61.1
  images_served:
    meaning: Image spans accepted into requests, including video steps and resent history; incremented before generation.
    type: nonnegative_integer
    optional: true
    since_glm: 0.51.0
source:
  counters: src/cachalot/cache/resident_store.py
  deepseek_export: src/cachalot/model/api.py
  deepseek_engine: src/cachalot/server/engine.py
  glm_minimax_engine: src/cachalot/glm/engine.py
availability:
  deepseek: Exported by V41Model.stats and forwarded by Engine.stats.
  glm_minimax: Since 0.61.1, GlmEngine.stats exports expert hit/miss, prediction, bytes, reads, fast reads, summed read time, busy time, and decode wait counters. Older versions omit them.
lab:
  display: Independent runtime totals from the current healthy connected snapshot.
  unavailable: Missing, malformed, negative, unsafe integer, nonfinite duration, out-of-range duration, unhealthy, or offline values show —.
  zero: Displayed as zero; does not imply prefetch is disabled.
  limits: No speedup, success percentage, wait percentage, busy rate, critical path, or per-request attribution is inferred.

image_input_total:
  source: GlmEngine.stream_chat increments images_served by len(spans) before model.stream.
  display: IMAGE INPUTS in Cockpit, with independent current-snapshot validation.
  limits: Not unique images, completed replies, or proof of vision capability.
  video_since_glm: 0.52.0
  video_meaning: Each sampled temporal step contributes a span; this is not a video or frame count.
  client: Lab image and video attachments remain pending; runtime API image support is separate.

read_wait_evidence:
  question: How many expert lookups and reads has this server accounted, and how much read activity and decode waiting has it recorded?
  lifetime: Cumulative since server/store creation; server restart resets counters. No stable session identifier is reported.
  display: Cockpit Runtime offers a collapsed Read and wait evidence table. Counts and bytes retain integer values; seconds use three decimal places.
  evidence: Runtime-reported measurements, except fast-read cache classification which is explicitly heuristic. No new derived rate or delta is calculated.
  scope: Expert-store totals; reads and lookups include prefill and decode. Wait counters cover decode only. No request or token attribution.
  fallback: Validate each field independently. Integers must be nonnegative safe integers; durations must be finite, nonnegative, and at most Number.MAX_SAFE_INTEGER. Missing is not zero.
  collection: Existing visible 1 Hz / hidden 0.2 Hz stats polling; no extra requests, history, persistence, exports, or runtime instrumentation. Raw fields remain in the current snapshot only.
  overhead: No inference-overhead measurement was performed; no overhead or performance claim is made.
  throttle: CACHALOT_READ_THROTTLE_GBPS is not reported over HTTP. Emulated drive bandwidth is unknown from stats and must not be inferred from a low rate.
  deferred: Per-token deltas need aligned windows and reset handling; decode wait share needs matching request decode durations. Busy-rate derivation needs confirmed byte/timing population alignment.

energy:
  since: 0.63.0
  question: What whole-system power and integrated energy has the runtime meter observed?
  fields:
    [
      enabled,
      available,
      sample_interval_seconds,
      samples,
      last_sample_age_seconds,
      since,
      system,
      components,
    ]
  system: SMC PSTR whole-system watts and cumulative joules since meter creation; includes idle, other apps, display. Source and measured tag are runtime-reported.
  components: IOReport cumulative cpu/gpu/ane/dram/dcs/amcc joules, displayed as SoC estimates even though the wire tag is measured. Never an additive breakdown of system energy.
  availability: Each source requires available true; false reason is shown, never a zero. Lab suppresses energy if reported age exceeds 5 * interval + 1 seconds, matching runtime freshness. Missing/invalid numbers stay unavailable independently.
  since_semantics: Epoch start of retained meter ring, not necessarily creation after ring rollover; cumulative joules do not reset at ring rollover. samples is retained count, capped by runtime history (default 7200).
  request_usage: usage.cachalot.energy, including final streaming usage with choices empty. Whole request excludes queue; decode is its last decode_seconds. Decode may be null independently of request availability.
  request_fields: seconds, system_joules, mean_system_watts, components_joules; decode also system_joules_per_token. No Lab division by unrelated cumulative token totals.
  sampling: Linear interpolation; up to two intervals of tail extrapolation. 0.63.1 corrects component-tail extrapolation. Short/first requests have up to one interval error at each end; no idle subtraction.
  storage: Current stats snapshot only. Raw request energy persists inside existing bounded conversation usage (20 MiB total, 200 conversations, 1000 messages each). No new durable telemetry history or export.
  overhead: Existing stats poll only; no new native sampler. Runtime meter cost remains unmeasured; Lab rendering/transport/inference overhead unmeasured.

token_trace:
  since: 0.64.0
  family: deepseek
  question: Where does time go across positionally sampled decode tokens?
  fields:
    [
      every,
      sampled_tokens,
      requests,
      dropped_events,
      exposed_read_share,
      mean_per_sampled_token,
    ]
  means:
    [
      wall_ms,
      sync_ms,
      blocked_ms,
      read_busy_ms,
      hidden_read_ms,
      reads,
      bytes,
      events,
    ]
  lifetime: Running means across sampled decode tokens since server start, drained at request completion; cancelled residuals cleared before next request. No request attribution or timeline endpoint.
  sync_ms: Router mx.eval window includes queued GPU work; not pure synchronization, compute, or waiting. 0.64.8 withdraws the router-sync-bound interpretation.
  blocked_ms: Main-thread expert-return call duration; exposed I/O, not proven critical path or guaranteed drive speedup.
  read_busy_ms: Union of worker read intervals in token window. hidden_read_ms is outside blocked intervals; crossing-boundary reads omitted. Do not sum overlapping rows.
  exposed_read_share: Runtime-derived sum(blocked_ms)/sum(read_busy_ms), null before reads. Approximate, not token latency fraction. Not clamped to fabricate a percentage.
  fallback: Unknown fields stay unavailable, zero is preserved. Means and ratio unavailable before positive valid sampled_tokens. Dropped events displayed; missing loss metadata means completeness unverified.
  overhead: Continuous +0.55 ms/token (95% +0.05 to +1.11), not certified against 1 ms stop rule. Later 1-in-4 average +0.274 ms/token (95% -0.065 to +0.645), not certified under 0.5 ms upper-bound rule. Workload-specific runtime measurements, not Lab overhead.
  collection: Existing poll and current raw snapshot only; no per-token history, new request, native instrumentation, trace export, or automatic inference tuning.
  deferred: Correlated event timeline, GPU completion, critical-path dependencies, durable run comparison and export.
