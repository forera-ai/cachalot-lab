patterns:
  - id: deepseek_decode_miss_budget
    since: 0.57.0
    families: [deepseek-v4.1-flash]
    regex: '^decode miss budget (?P<budget>\d+): at most .+$'
    meaning: Decode drops experts beyond the miss read cap and changes outputs. Raw Logs only; not a runtime version or quality signal.
  - id: system_date_reuse
    since: 0.60.0
    families: [deepseek-v4.1-flash]
    regex: '^system date reuse: .+$'
    meaning: Startup announces the date reuse window; raw Logs only.
  - id: system_date_replaced
    since: 0.60.0
    families: [deepseek-v4.1-flash]
    regex: '^\[request\] system date: showing (?P<shown>.+) for (?P<true>.+)$'
    meaning: The model sees the saved date while client history retains the true date; raw Logs only.
  - id: deepseek_wired_fit
    since: 0.54.0
    families: [deepseek-v4.1-flash]
    regex: '^wired fit: expert slots (?P<old>\d+) -> (?P<new>\d+) \(system wired .+, ceiling .+\)$'
    meaning: Runtime changed resident capacity under whole-system wired pressure. Cockpit reads resident_experts from HTTP rather than parsing this line.
  - id: routing_trace
    since: 0.55.0
    families: [deepseek-v4.1-flash]
    regex: '^routing trace (on|saved): .+$'
    meaning: Measurement trace start or save; not normal tuning or a performance result.
  - id: glm_expert_bank
    since: 0.49.0
    families: [glm-5.3-flash]
    regex: '^GLM expert bank: (?P<path>.+)$'
    meaning: GLM selected a contiguous bank at startup. Logs displays the raw line; Lab does not infer live telemetry or compatibility from it.
  - id: loop_guard
    since: 0.40.0
    families: [glm-5.3-flash, minimax-m3]
    regex: '^\[loop guard\] reply stopped after (?P<tokens>\d+) tokens: a (?P<block>\d+)-token block repeated (?P<repeats>\d+) times$'
    meaning: The reply looped and was stopped; this precedes its [request] line.
  - id: loop_guard_incrementing
    since: 0.46.0
    families: [glm-5.3-flash, minimax-m3]
    regex: '^\[loop guard\] reply stopped after (?P<tokens>\d+) tokens: (?P<items>\d+) list items counting up by one, none of them in the prompt$'
    meaning: An invented counting list was stopped. Logs displays the line raw; a future loop-stop indicator should match the common prefix shared with the repeated-block guard.
  - id: unclosed_tool_block_dropped
    since: 0.43.2
    families: [glm-5.3-flash, minimax-m3]
    regex: '^\[tool call\] unclosed block dropped \((?P<chars>\d+) chars\) at a (?P<reason>loop guard|length) stop$'
    meaning: A cut reply ended inside a tool call; the incomplete call markup was removed from client content. Future Logs UI can show a reply-cut marker with the loop-guard line when present.
  - id: minimax_mirror_share
    since: 0.45.0
    families: [minimax-m3]
    regex: '^\[bank\] mirror share (?P<old>\d+\.\d+) -> (?P<new>\d+\.\d+) \(configured (?P<cap>\d+\.\d+)\)$'
    meaning: The adaptive mirror share changed by at least 0.03; emitted at most once a minute. Logs displays it raw; Cockpit does not yet parse or chart it.
