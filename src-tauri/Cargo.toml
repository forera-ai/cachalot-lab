[package]
name = "cachalot-studio"
version = "0.1.0"
description = "Mac desktop instrument panel for Cachalot"
authors = ["Hamed Prooshani"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cachalot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
