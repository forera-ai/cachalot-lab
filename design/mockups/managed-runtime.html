<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cachalot Lab · Managed runtime concept</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #d9e4e7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .intro {
        max-width: 1320px;
        margin: 0 auto 20px;
        color: #173745;
      }
      .intro h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .intro p {
        margin: 0;
        color: #476571;
      }
      .frame {
        --canvas: #07131b;
        --rail: #061018;
        --raised: #0b1e29;
        --inset: #102733;
        --border: #213a47;
        --text: #eaf7f7;
        --muted: #a4c0c7;
        --faint: #7f9da7;
        --accent: #33cfff;
        --ok: #7be0d0;
        width: min(1320px, 100%);
        height: 800px;
        margin: 0 auto 42px;
        display: grid;
        grid-template-columns: 220px 1fr;
        overflow: hidden;
        border-radius: 18px;
        background: var(--canvas);
        color: var(--text);
        box-shadow: 0 24px 70px #18384538;
      }
      .frame.surface {
        --canvas: #f2f8fa;
        --rail: #e4f0f1;
        --raised: #fff;
        --inset: #e9f2f3;
        --border: #cbdde1;
        --text: #12313f;
        --muted: #4d6974;
        --faint: #607a84;
        --accent: #006fa8;
        --ok: #096f68;
      }
      aside {
        display: flex;
        flex-direction: column;
        background: var(--rail);
        border-right: 1px solid var(--border);
        padding: 32px 16px 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid var(--accent);
        border-radius: 12px;
        color: var(--accent);
        font-size: 22px;
      }
      .navlabel {
        margin: 48px 12px 12px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      .nav {
        padding: 11px 12px;
        margin: 2px 0;
        border-radius: 9px;
        color: var(--muted);
        font-size: 14px;
      }
      .nav.selected {
        background: var(--inset);
        color: var(--text);
        border-left: 3px solid var(--accent);
        padding-left: 9px;
      }
      .railfoot {
        margin-top: auto;
        padding: 16px 12px 0;
        border-top: 1px solid var(--border);
        color: var(--faint);
        font-size: 11px;
        line-height: 1.7;
      }
      main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      header {
        height: 70px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
        border-bottom: 1px solid var(--border);
        color: var(--faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      .command {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        letter-spacing: 0;
        font-size: 12px;
      }
      .content {
        min-height: 0;
        flex: 1;
        padding: 28px 34px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.2em;
      }
      .heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 8px 0 25px;
      }
      .heading h2 {
        font-size: 34px;
        letter-spacing: -0.045em;
        margin: 0 0 4px;
      }
      .heading p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .button {
        display: inline-block;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #06202a;
      }
      .surface .button.primary {
        color: white;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(220px, 0.83fr) minmax(420px, 1.65fr);
        gap: 18px;
      }
      .card {
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }
      .cardhead {
        padding: 19px 20px;
        border-bottom: 1px solid var(--border);
      }
      .kicker {
        color: var(--faint);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .cardhead h3 {
        margin: 5px 0 0;
        font-size: 18px;
      }
      .profile {
        margin: 14px;
        padding: 15px;
        border: 1px solid var(--accent);
        border-radius: 11px;
        background: var(--inset);
      }
      .profile h4 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .profile p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .profile .row {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .dot {
        width: 7px;
        height: 7px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--ok);
      }
      .add {
        padding: 4px 26px 18px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }
      .state {
        color: var(--ok);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .status small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px 22px;
        padding: 20px;
      }
      .detail label {
        display: block;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 7px;
      }
      .detail div {
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--inset);
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .note {
        margin: 0 20px 18px;
        padding: 12px 14px;
        border-left: 2px solid var(--accent);
        background: var(--inset);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px 20px;
      }
      .actions span {
        margin-left: auto;
        color: var(--faint);
        font-size: 11px;
      }
      .bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 18px;
      }
      .mini {
        padding: 19px 20px;
      }
      .mini h3 {
        margin: 6px 0 12px;
        font-size: 16px;
      }
      .mini p {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .mini strong {
        color: var(--ok);
        font-weight: 700;
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }
      footer {
        height: 70px;
        flex: none;
        display: flex;
        gap: 28px;
        align-items: center;
        padding: 0 34px;
        border-top: 1px solid var(--border);
        color: var(--faint);
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      footer strong {
        display: block;
        margin-top: 5px;
        color: var(--text);
        font-size: 12px;
        letter-spacing: 0;
      }
      @media (max-width: 1050px) {
        body {
          padding: 16px;
        }
        .frame {
          width: 1320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <h1>Managed runtime · proposed Dive screen</h1>
      <p>
        Static review artifact. Sample paths and readings illustrate layout
        only.
      </p>
    </div>
    <div id="mockups"></div>
    <template id="screen">
      <section class="frame">
        <aside>
          <div class="brand">
            <span class="mark">C</span><span>CACHALOT<br />LAB</span>
          </div>
          <div class="navlabel">WORKSPACE</div>
          <div class="nav">◉ &nbsp; Cockpit</div>
          <div class="nav">▤ &nbsp; Chat</div>
          <div class="nav selected">◈ &nbsp; Dive</div>
          <div class="nav">◇ &nbsp; API</div>
          <div class="navlabel">SYSTEM</div>
          <div class="nav">✚ &nbsp; Doctor</div>
          <div class="nav">⚙ &nbsp; Settings</div>
          <div class="railfoot">
            ● &nbsp; MANAGED RUNTIME READY<br />LAB 0.2.0 CONCEPT
          </div>
        </aside>
        <main>
          <header>
            <span>LAB &nbsp;/&nbsp; DIVE</span
            ><span class="command">⌘ K &nbsp; Command palette</span>
          </header>
          <div class="content">
            <div class="eyebrow">LOCAL RUNTIME CONTROL</div>
            <div class="heading">
              <div>
                <h2>Dive</h2>
                <p>
                  Choose a profile, inspect the launch plan, then start Cachalot
                  on this Mac.
                </p>
              </div>
              <span class="button">+ New profile</span>
            </div>
            <div class="columns">
              <div class="card">
                <div class="cardhead">
                  <div class="kicker">01 &nbsp; / &nbsp; SAVED PROFILES</div>
                  <h3>Your launch setups</h3>
                </div>
                <div class="profile">
                  <div class="row">
                    <h4>DeepSeek local</h4>
                    <span class="dot"></span>
                  </div>
                  <p>DeepSeek V4.1 · port 8011<br />24 GiB expert budget</p>
                </div>
                <div class="add">+ Add another profile</div>
              </div>
              <div class="card">
                <div class="cardhead">
                  <div class="kicker">02 &nbsp; / &nbsp; SELECTED PROFILE</div>
                  <h3>DeepSeek local</h3>
                </div>
                <div class="status">
                  <div>
                    <div class="state">● &nbsp; READY TO START</div>
                    <small
                      >Lab owns only processes started from this screen.</small
                    >
                  </div>
                  <span class="button">Edit profile</span>
                </div>
                <div class="details">
                  <div class="detail">
                    <label>PYTHON ENVIRONMENT</label>
                    <div>/Users/me/cachalot/.venv/bin/python</div>
                  </div>
                  <div class="detail">
                    <label>MODEL DIRECTORY</label>
                    <div>/Volumes/Models/DeepSeek-V4.1</div>
                  </div>
                  <div class="detail">
                    <label>LOCAL ENDPOINT</label>
                    <div>127.0.0.1:8011</div>
                  </div>
                  <div class="detail">
                    <label>MODEL FAMILY</label>
                    <div>Auto detect</div>
                  </div>
                </div>
                <div class="note">
                  Lab checks port before launch. Existing server stays
                  untouched. Startup may take several minutes while model loads.
                </div>
                <div class="actions">
                  <span class="button primary">Start runtime</span
                  ><span class="button">Preview command</span
                  ><span>Local only</span>
                </div>
              </div>
            </div>
            <div class="bottom">
              <div class="card mini">
                <div class="kicker">READINESS</div>
                <h3>Before you dive</h3>
                <p><strong>●</strong> Python environment found</p>
                <p><strong>●</strong> Model directory found</p>
                <p><strong>●</strong> Port 8011 available</p>
              </div>
              <div class="card mini">
                <div class="kicker">RUNTIME LOG</div>
                <h3>Waiting for launch</h3>
                <div class="log">
                  Launch output appears here after Lab starts a profile.<br />Crash
                  details remain local in Lab data.
                </div>
              </div>
            </div>
          </div>
          <footer>
            <div>STATE<strong>NOT RUNNING</strong></div>
            <div>MODEL<strong>DeepSeek V4.1</strong></div>
            <div>DECODE<strong>— tok/s</strong></div>
            <div>EXPERT HITS<strong>— %</strong></div>
            <div>SSD READ<strong>— GB/s</strong></div>
          </footer>
        </main>
      </section>
    </template>
    <script>
      const root = document.getElementById('mockups')
      for (const theme of ['abyss', 'surface']) {
        const screen = document.getElementById('screen').content.cloneNode(true)
        screen.querySelector('.frame').classList.add(theme)
        root.append(screen)
      }
    </script>
  </body>
</html>
